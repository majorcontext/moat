name: esp32-dev

dependencies:
  - python

# Hardware test example for a LilyGO T-Display S3 (ESP32-S3).
#
# The T-Display S3 has no USB-UART bridge chip: the ESP32-S3's own USB
# peripheral enumerates as a CDC serial port (Espressif VID 303a, PID 1001).
#
# Run `moat device list` on the host and copy the USB ID it prints if yours
# differs. Other IDs this board can show up as:
#   303a:1001  ESP32-S3 USB-Serial-JTAG / CDC  (T-Display S3, most common)
#   303a:1002  ESP32-S3 ROM download mode
#   10c4:ea60  CP2102 bridge                  (T-Display, T-Beam)
#   1a86:55d4  CH9102F bridge                 (newer LilyGO revisions)
#   1a86:7523  CH340 bridge                   (cheap clones)
devices:
  - name: esp32
    match: {usb: "303a:1001"}
