# Example: OpenAI Codex agent
#
# Run Codex CLI in an isolated container with credential injection.
#
# Run with:
#   moat codex examples/agent-codex
#   moat codex examples/agent-codex -p "fix the bug in main.py"

name: codex-test

dependencies:
  - node@22
  - codex-cli
  - git

grants:
  - openai

command: ["codex"]
interactive: true

# Codex session transcripts sync to the host under
# ~/.moat/codex/sessions/<workspace>-<id> when the "openai" grant is configured.
# To disable: codex: { sync_logs: false }
# To use your own ~/.codex/sessions instead (shares every project's history
# with the container): codex: { shared_sessions: true }
